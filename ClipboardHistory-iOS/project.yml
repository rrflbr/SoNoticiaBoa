name: ClipboardHistory
options:
  bundleIdPrefix: com.sonoticiaboa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Preencha com o seu Team ID da Apple (ou escolha o time no Xcode depois).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  ClipboardHistory:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: ClipboardKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonoticiaboa.clipboardhistory
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clip 10
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sonoticiaboa.clipboardhistory

  ClipboardKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonoticiaboa.clipboardhistory.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Clip 10
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: pt-BR
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sonoticiaboa.clipboardhistory

  ClipboardHistoryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/ClipboardStore.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sonoticiaboa.clipboardhistory.tests

schemes:
  ClipboardHistory:
    build:
      targets:
        ClipboardHistory: all
    test:
      targets: [ClipboardHistoryTests]
